site_name: Rust From First Principles — Under Development
site_description: Building a GPU-Native Tensor and Autodiff Framework in Rust, One Layer at a Time
site_author: Oluwaseyi Awoga
copyright: Copyright &copy; 2026 Oluwaseyi Awoga

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    logo: fontawesome/brands/rust

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - footnotes

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - "Part 0 — Rust Foundations":
      - "1. Variables, Ownership, and Types": part0/01-variables-ownership-types.md
      - "2. Struct Design Patterns": part0/02-struct-design-patterns.md
      - "3. Memory Layout Strategies": part0/03-memory-layout-strategies.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/maximumbeings
